<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>America250 Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-tertiary:#334155;
--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
--accent:#3b82f6;--accent-hover:#60a5fa;--accent-dim:#1e3a5f;
--border:#334155;--gold:#f59e0b;--green:#22c55e;--red:#ef4444;
--card-shadow:0 4px 6px -1px rgba(0,0,0,0.3);--hover-glow:0 0 20px rgba(59,130,246,0.15);
}
[data-theme="light"]{
--bg-primary:#f1f5f9;--bg-secondary:#ffffff;--bg-tertiary:#e2e8f0;
--text-primary:#1e293b;--text-secondary:#475569;--text-muted:#94a3b8;
--accent:#2563eb;--accent-hover:#3b82f6;--accent-dim:#dbeafe;
--border:#cbd5e1;--card-shadow:0 4px 6px -1px rgba(0,0,0,0.1);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);transition:background .3s,color .3s;overflow-x:hidden}
.app{display:grid;grid-template-rows:auto auto auto auto 1fr auto;min-height:100vh;gap:0}
header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-hover));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-left{display:flex;align-items:baseline;gap:12px}
.subtitle{color:var(--text-muted);font-size:.75rem}
.theme-toggle{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:24px;padding:6px 16px;color:var(--text-primary);cursor:pointer;font-size:.8rem;transition:all .2s;display:flex;align-items:center;gap:6px;font-family:inherit}
.theme-toggle:hover{border-color:var(--accent);box-shadow:var(--hover-glow)}
.filter-bar{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{color:var(--text-muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.filter-bar input,.filter-bar select{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text-primary);font-size:.82rem;font-family:inherit;transition:all .2s;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
.filter-bar input{width:220px}
.filter-bar select{min-width:150px}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:18px 24px}
.kpi-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:14px 18px;transition:all .3s;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));opacity:0;transition:opacity .3s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow);border-color:var(--accent)}
.kpi-card:hover::before{opacity:1}
.kpi-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:4px;font-weight:600}
.kpi-value{font-size:1.3rem;font-weight:700;color:var(--text-primary)}
.kpi-sub{font-size:.65rem;color:var(--text-secondary);margin-top:3px}
.map-section{padding:20px 24px 10px;position:relative}
.map-section h3{font-size:.9rem;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
#us-map{width:100%;max-width:960px;margin:0 auto}
#us-map svg{width:100%;height:auto;display:block}
#us-map svg path.state-path{stroke:var(--bg-primary);stroke-width:0.5;cursor:pointer;transition:fill .2s,stroke .15s,stroke-width .15s}
#us-map svg path.state-path:hover{filter:brightness(1.4);stroke:var(--accent-hover);stroke-width:1.2}
#us-map svg path.state-path.selected{stroke:var(--gold);stroke-width:2;filter:brightness(1.3)}
.tooltip{position:fixed;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.82rem;pointer-events:none;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .12s;max-width:240px}
.tooltip.visible{opacity:1}
.tooltip .tt-name{font-weight:700;margin-bottom:2px;font-size:.9rem}
.tooltip .tt-metric{color:var(--text-muted);font-size:.7rem;margin-bottom:1px}
.tooltip .tt-value{color:var(--accent-hover);font-size:1rem;font-weight:600}
.main-content{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:0;min-height:480px}
.state-panel{background:var(--bg-secondary);border-right:1px solid var(--border);padding:20px;overflow-y:auto;max-height:520px}
.state-panel h2{font-size:1.1rem;font-weight:700;margin-bottom:2px}
.state-abbr{color:var(--accent);font-size:.8rem;font-weight:600;margin-bottom:14px}
.state-stats{display:grid;gap:8px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg-tertiary);border-radius:8px;font-size:.82rem}
.stat-row .label{color:var(--text-secondary)}
.stat-row .value{font-weight:600;color:var(--text-primary)}
.charts-panel{padding:16px 20px;overflow-y:auto;max-height:520px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.chart-title{font-size:.72rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.data-table-section{padding:18px 24px;border-top:1px solid var(--border)}
.data-table-section h3{font-size:.95rem;font-weight:600;margin-bottom:10px}
.table-wrapper{overflow-x:auto;border-radius:12px;border:1px solid var(--border);max-height:400px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:var(--bg-secondary);padding:9px 12px;text-align:left;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;font-size:.68rem;cursor:pointer;white-space:nowrap;position:sticky;top:0;border-bottom:2px solid var(--border);user-select:none;z-index:2}
th:hover{color:var(--accent)}
th.sorted{color:var(--accent)}
th .arrow{margin-left:3px;font-size:.6rem}
td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-primary)}
tr:hover td{background:var(--bg-tertiary)}
tr.selected td{background:rgba(59,130,246,.1)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state h3{font-size:1rem;margin-bottom:6px;color:var(--text-secondary)}
.loading{text-align:center;padding:120px 20px;color:var(--text-muted);font-size:1rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.main-content{grid-template-columns:1fr}.state-panel{max-height:none;border-right:none;border-bottom:1px solid var(--border)}.charts-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.filter-bar{flex-direction:column}.filter-bar input{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<div id="tooltip-el" class="tooltip"></div>
<script>
window._mapReady = new Promise(function(resolve) {
  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(function(r) { return r.json(); })
    .then(function(us) {
      window._usTopo = us;
      resolve(us);
    })
    .catch(function(e) {
      console.error('Failed to load map data', e);
      window._usTopo = null;
      resolve(null);
    });
});
</script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const {LineChart,Line,BarChart,Bar,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip:ReTooltip,Legend,ResponsiveContainer}=Recharts;

const FIPS_TO_ABBR={"01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT","10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL","18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD","25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE","32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND","39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD","47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV","55":"WI","56":"WY"};

const METRIC_LABELS={hpi_latest:'House Price Index',airports:'Airports',building_permits_latest:'Building Permits',road_length_miles:'Road Miles',transit_ridership_upt:'Transit Ridership'};
const METRIC_KEYS=Object.keys(METRIC_LABELS);
const COLORS=['#3b82f6','#60a5fa','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4'];

function formatNum(n){if(n==null)return'\u2014';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return typeof n==='number'?n.toLocaleString():n}

function USMap({states,metric,selectedState,onSelect,onHover}){
  const containerRef=useRef(null);
  const svgRef=useRef(null);
  const pathDataRef=useRef(null);
  const metricKey=metric||'hpi_latest';

  useEffect(()=>{
    window._mapReady.then(function(us){
      if(!us||!containerRef.current)return;
      containerRef.current.innerHTML='';
      const w=960,h=620;
      const svg=d3.select(containerRef.current).append('svg').attr('viewBox','0 0 '+w+' '+h).attr('preserveAspectRatio','xMidYMid meet');
      const statesTopo=topojson.feature(us,us.objects.states);
      const graticule=d3.geoGraticule();
      const projection=d3.geoAlbersUsa().scale(1280).translate([w/2,h/2-20]);
      const pathGen=d3.geoPath(projection);
      svg.append('path').datum(graticule()).attr('d',pathGen).attr('fill','none').attr('stroke','var(--border)').attr('stroke-width',0.2).attr('stroke-opacity',0.3);
      const paths=svg.selectAll('path.state-path').data(statesTopo.features).enter().append('path')
        .attr('class','state-path')
        .attr('d',pathGen)
        .attr('data-id',function(d){return FIPS_TO_ABBR[d.id]||d.id})
        .on('click',function(e,d){var abbr=FIPS_TO_ABBR[d.id];if(abbr)onSelect(abbr)})
        .on('mouseenter',function(e,d){var abbr=FIPS_TO_ABBR[d.id];if(abbr)onHover(abbr,e)})
        .on('mousemove',function(e,d){var abbr=FIPS_TO_ABBR[d.id];if(abbr)onHover(abbr,e)})
        .on('mouseleave',function(){onHover(null)});
      pathDataRef.current=paths;
      svgRef.current=svg;
    });
  },[]);

  useEffect(()=>{
    if(!pathDataRef.current)return;
    const vals=Object.values(states).map(function(s){return s[metricKey]}).filter(function(v){return v!=null});
    const min=Math.min.apply(null,vals.length?vals:[0]);
    const max=Math.max.apply(null,vals.length?vals:[1]);
    pathDataRef.current.attr('fill',function(d){
      var abbr=FIPS_TO_ABBR[d.id];
      var s=states[abbr];
      if(!s)return '#334155';
      var val=s[metricKey]||0;
      var t=max===min?0.5:(val-min)/(max-min);
      var r=Math.round(30+t*66),g=Math.round(58+t*47),b=Math.round(95+t*101);
      return'rgb('+r+','+g+','+b+')';
    }).classed('selected',function(d){
      return FIPS_TO_ABBR[d.id]===selectedState;
    });
  },[states,metricKey,selectedState]);

  return React.createElement('div',{ref:containerRef,id:'us-map'});
}

function KPICards({summary}){
  var cards=[
    {label:'Total Airports',value:formatNum(summary.total_airports),sub:'Commercial + General Aviation'},
    {label:'Total Runways',value:formatNum(summary.total_runways),sub:'Active runway count'},
    {label:'Road Miles',value:formatNum(summary.total_road_miles),sub:'Public road network'},
    {label:'Building Permits',value:formatNum(summary.total_building_permits),sub:'Residential permits'},
    {label:'Avg HPI',value:summary.avg_hpi?summary.avg_hpi.toFixed(1):'\u2014',sub:'House Price Index (2026)'},
    {label:'Transit Ridership',value:formatNum(summary.total_transit_ridership),sub:'Unlinked passenger trips'}
  ];
  return React.createElement('div',{className:'kpi-row'},cards.map(function(c,i){
    return React.createElement('div',{className:'kpi-card fade-in',key:i,style:{animationDelay:i*40+'ms'}},
      React.createElement('div',{className:'kpi-label'},c.label),
      React.createElement('div',{className:'kpi-value'},c.value),
      React.createElement('div',{className:'kpi-sub'},c.sub)
    );
  }));
}

function StatePanel({abbr,states}){
  if(!abbr)return React.createElement('div',{className:'empty-state'},React.createElement('h3',null,'Select a State'),React.createElement('p',null,'Click a state on the map to view details'));
  var s=states[abbr];
  if(!s)return null;
  var stats=[
    ['Population',formatNum(s.population)],
    ['Airports',formatNum(s.airports)],
    ['Runways',formatNum(s.runways)],
    ['Road Miles',formatNum(s.road_length_miles)],
    ['Vehicle Miles (M)',formatNum(s.vehicle_miles_millions)],
    ['HPI ('+s.hpi_year+')',s.hpi_latest?s.hpi_latest.toFixed(1):'\u2014'],
    ['Building Permits',formatNum(s.building_permits_latest)],
    ['Transit Agencies',formatNum(s.transit_agencies)],
    ['Transit Ridership',formatNum(s.transit_ridership_upt)]
  ];
  return React.createElement('div',{className:'fade-in',key:abbr},
    React.createElement('h2',null,s.name),
    React.createElement('div',{className:'state-abbr'},s.abbr),
    React.createElement('div',{className:'state-stats'},stats.map(function(r,i){
      return React.createElement('div',{className:'stat-row',key:i},
        React.createElement('span',{className:'label'},r[0]),
        React.createElement('span',{className:'value'},r[1])
      );
    }))
  );
}

function ChartsPanel({abbr,states}){
  if(!abbr)return React.createElement('div',{className:'empty-state'},React.createElement('h3',null,'State Charts'),React.createElement('p',null,'Select a state to view detailed charts'));
  var s=states[abbr];
  if(!s)return null;
  var hpiData=s.hpi_trend||[];
  var permitData=s.building_permits_trend||[];
  var airportData=(s.airport_types||[]).map(function(t){return{name:(t.type||'').replace(/"/g,'').replace(/_/g,' '),value:t.count}}).filter(function(d){return d.value>0});
  var roadVal=s.road_length_miles||0;
  var vehVal=s.vehicle_miles_millions||0;
  var maxRV=Math.max(roadVal,vehVal)||1;
  var barData=[{name:'Road Mi (K)',value:roadVal/1000},{name:'Vehicle Mi (M)',value:vehVal/1000}];
  var ttStyle={background:'var(--bg-secondary)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text-primary)',fontSize:12};
  return React.createElement('div',{className:'charts-grid fade-in',key:abbr},
    React.createElement('div',{className:'chart-card'},
      React.createElement('div',{className:'chart-title'},'HPI Trend \u2014 '+s.name),
      hpiData.length?React.createElement(ResponsiveContainer,{width:'100%',height:190},
        React.createElement(LineChart,{data:hpiData,margin:{top:5,right:10,left:-10,bottom:5}},
          React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border)'}),
          React.createElement(XAxis,{dataKey:'year',tick:{fill:'var(--text-muted)',fontSize:10},tickLine:false}),
          React.createElement(YAxis,tick:{fill:'var(--text-muted)',fontSize:10},tickLine:false,axisLine:false),
          React.createElement(ReTooltip,{contentStyle:ttStyle}),
          React.createElement(Line,{type:'monotone',dataKey:'hpi',stroke:'#3b82f6',strokeWidth:2,dot:false,activeDot:{r:4,fill:'#3b82f6'}})
        )
      ):React.createElement('div',{style:{textAlign:'center',padding:'30px',color:'var(--text-muted)',fontSize:12}},'No HPI data')
    ),
    React.createElement('div',{className:'chart-card'},
      React.createElement('div',{className:'chart-title'},'Building Permits Trend'),
      permitData.length?React.createElement(ResponsiveContainer,{width:'100%',height:190},
        React.createElement(BarChart,{data:permitData,margin:{top:5,right:10,left:-10,bottom:5}},
          React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border)'}),
          React.createElement(XAxis,{dataKey:'year',tick:{fill:'var(--text-muted)',fontSize:10},tickLine:false}),
          React.createElement(YAxis,tick:{fill:'var(--text-muted)',fontSize:10},tickLine:false,axisLine:false),
          React.createElement(ReTooltip,{contentStyle:ttStyle}),
          React.createElement(Bar,{dataKey:'permits',fill:'#3b82f6',radius:[4,4,0,0]})
        )
      ):React.createElement('div',{style:{textAlign:'center',padding:'30px',color:'var(--text-muted)',fontSize:12}},'No permits data')
    ),
    React.createElement('div',{className:'chart-card'},
      React.createElement('div',{className:'chart-title'},'Airport Types'),
      airportData.length?React.createElement(ResponsiveContainer,{width:'100%',height:190},
        React.createElement(PieChart,null,
          React.createElement(Pie,{data:airportData,cx:'50%',cy:'50%',outerRadius:65,dataKey:'value',label:function(p){return p.name+' ('+p.value+')'},labelLine:false},
            airportData.map(function(_,i){return React.createElement(Cell,{key:i,fill:COLORS[i%COLORS.length]})})
          ),
          React.createElement(ReTooltip,{contentStyle:ttStyle}),
          React.createElement(Legend,{wrapperStyle:{fontSize:10,color:'var(--text-secondary)',paddingTop:4}})
        )
      ):React.createElement('div',{style:{textAlign:'center',padding:'30px',color:'var(--text-muted)',fontSize:12}},'No airport data')
    ),
    React.createElement('div',{className:'chart-card'},
      React.createElement('div',{className:'chart-title'},'Road vs Vehicle Miles (K)'),
      React.createElement(ResponsiveContainer,{width:'100%',height:190},
        React.createElement(BarChart,{data:barData,layout:'vertical',margin:{top:5,right:10,left:10,bottom:5}},
          React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border)'}),
          React.createElement(XAxis,{type:'number',tick:{fill:'var(--text-muted)',fontSize:10},tickLine:false}),
          React.createElement(YAxis,{type:'category',dataKey:'name',tick:{fill:'var(--text-muted)',fontSize:10},width:85,tickLine:false,axisLine:false}),
          React.createElement(ReTooltip,{contentStyle:ttStyle}),
          React.createElement(Bar,{dataKey:'value',fill:'#3b82f6',radius:[0,4,4,0]})
        )
      )
    )
  );
}

function DataTable({states,selectedState,onSelect,sortCol,sortDir,onSort,searchTerm}){
  var stateList=useMemo(function(){
    var list=Object.values(states);
    if(searchTerm){var t=searchTerm.toLowerCase();list=list.filter(function(s){return s.name.toLowerCase().indexOf(t)!==-1||s.abbr.toLowerCase().indexOf(t)!==-1})}
    list.sort(function(a,b){
      var va=a[sortCol],vb=b[sortCol];
      if(va==null)va=0;if(vb==null)vb=0;
      if(typeof va==='string')return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      return sortDir==='asc'?va-vb:vb-va;
    });
    return list;
  },[states,sortCol,sortDir,searchTerm]);
  var cols=[
    {key:'abbr',label:'Abbr',w:52},{key:'name',label:'State',w:120},{key:'population',label:'Population',w:92},
    {key:'airports',label:'Airports',w:75},{key:'runways',label:'Runways',w:70},{key:'road_length_miles',label:'Road Miles',w:90},
    {key:'vehicle_miles_millions',label:'Veh. Miles (M)',w:105},{key:'hpi_latest',label:'HPI',w:70},
    {key:'building_permits_latest',label:'Permits',w:80},{key:'transit_ridership_upt',label:'Transit',w:95}
  ];
  return React.createElement('div',{className:'table-wrapper'},
    React.createElement('table',null,
      React.createElement('thead',null,
        React.createElement('tr',null,cols.map(function(c){
          return React.createElement('th',{key:c.key,style:{minWidth:c.w},className:sortCol===c.key?'sorted':'',onClick:function(){onSort(c.key)}},
            c.label,sortCol===c.key?React.createElement('span',{className:'arrow'},sortDir==='asc'?'\u25B2':'\u25BC'):''
          );
        }))
      ),
      React.createElement('tbody',null,stateList.map(function(s){
        return React.createElement('tr',{key:s.abbr,className:s.abbr===selectedState?'selected':'',onClick:function(){onSelect(s.abbr)},style:{cursor:'pointer'}},
          React.createElement('td',null,React.createElement('strong',null,s.abbr)),
          React.createElement('td',null,s.name),
          React.createElement('td',null,formatNum(s.population)),
          React.createElement('td',null,formatNum(s.airports)),
          React.createElement('td',null,formatNum(s.runways)),
          React.createElement('td',null,formatNum(s.road_length_miles)),
          React.createElement('td',null,formatNum(s.vehicle_miles_millions)),
          React.createElement('td',null,s.hpi_latest!=null?s.hpi_latest.toFixed(1):'\u2014'),
          React.createElement('td',null,formatNum(s.building_permits_latest)),
          React.createElement('td',null,formatNum(s.transit_ridership_upt))
        );
      }))
    )
  );
}

function App(){
  var [data,setData]=useState(null);
  var [loading,setLoading]=useState(true);
  var [mapReady,setMapReady]=useState(false);
  var [theme,setTheme]=useState('dark');
  var [selectedState,setSelectedState]=useState(null);
  var [hoverInfo,setHoverInfo]=useState(null);
  var [tooltipPos,setTooltipPos]=useState({x:0,y:0});
  var [searchTerm,setSearchTerm]=useState('');
  var [datasetFilter,setDatasetFilter]=useState('hpi_latest');
  var [sortCol,setSortCol]=useState('name');
  var [sortDir,setSortDir]=useState('asc');
  var tooltipElRef=useRef(null);

  useEffect(function(){
    Promise.all([
      fetch('dashboard_data.json').then(function(r){return r.json()}),
      window._mapReady
    ]).then(function(results){
      setData(results[0]);
      setLoading(false);
      setTimeout(function(){setMapReady(true)},100);
    }).catch(function(e){
      console.error(e);
      setLoading(false);
    });
  },[]);

  useEffect(function(){
    document.documentElement.setAttribute('data-theme',theme);
  },[theme]);

  useEffect(function(){
    var el=document.getElementById('tooltip-el');
    if(!el)return;
    if(hoverInfo){
      el.className='tooltip visible';
      el.innerHTML='<div class="tt-name">'+hoverInfo.name+'</div><div class="tt-metric">'+hoverInfo.metricLabel+'</div><div class="tt-value">'+hoverInfo.value+'</div>';
      el.style.left=(tooltipPos.x+14)+'px';
      el.style.top=(tooltipPos.y-14)+'px';
    } else {
      el.className='tooltip';
    }
  },[hoverInfo,tooltipPos]);

  var handleSort=useCallback(function(col){
    setSortDir(function(prev){return sortCol===col?(prev==='asc'?'desc':'asc'):'asc'});
    setSortCol(col);
  },[sortCol]);

  var handleHover=useCallback(function(abbr,e){
    if(!abbr||!data){setHoverInfo(null);return}
    var s=data.states[abbr];
    if(!s)return;
    var val=s[datasetFilter];
    setHoverInfo({name:s.name,metricLabel:METRIC_LABELS[datasetFilter]||'HPI',value:formatNum(val)});
    if(e&&e.clientX)setTooltipPos({x:e.clientX,y:e.clientY});
  },[data,datasetFilter]);

  if(loading)return React.createElement('div',{className:'loading'},'Loading dashboard data\u2026');
  if(!data)return React.createElement('div',{className:'loading'},'Error loading data. Make sure dashboard_data.json is in the same directory.');

  return React.createElement('div',{className:'app'},
    React.createElement('header',null,
      React.createElement('div',{className:'header-left'},
        React.createElement('h1',null,'America250 Dashboard'),
        React.createElement('span',{className:'subtitle'},'U.S. Transportation & Housing Data Explorer')
      ),
      React.createElement('button',{className:'theme-toggle',onClick:function(){setTheme(function(t){return t==='dark'?'light':'dark'})}},
        theme==='dark'?'\u2600\uFE0F Light Mode':'\uD83C\uDF19 Dark Mode'
      )
    ),
    React.createElement('div',{className:'filter-bar'},
      React.createElement('div',{className:'filter-group'},
        React.createElement('span',{className:'filter-label'},'Search'),
        React.createElement('input',{type:'text',placeholder:'Search states\u2026',value:searchTerm,onChange:function(e){setSearchTerm(e.target.value)}})
      ),
      React.createElement('div',{className:'filter-group'},
        React.createElement('span',{className:'filter-label'},'Dataset (Map Color)'),
        React.createElement('select',{value:datasetFilter,onChange:function(e){setDatasetFilter(e.target.value)}},
          METRIC_KEYS.map(function(k){return React.createElement('option',{key:k,value:k},METRIC_LABELS[k])})
        )
      )
    ),
    React.createElement(KPICards,{summary:data.summary}),
    React.createElement('div',{className:'map-section'},
      React.createElement('h3',null,'Interactive U.S. Map \u2014 Colored by: '+(METRIC_LABELS[datasetFilter]||'HPI')),
      React.createElement(USMap,{states:data.states,metric:datasetFilter,selectedState:selectedState,onSelect:setSelectedState,onHover:handleHover})
    ),
    React.createElement('div',{className:'main-content'},
      React.createElement('div',{className:'state-panel'},React.createElement(StatePanel,{abbr:selectedState,states:data.states})),
      React.createElement('div',{className:'charts-panel'},React.createElement(ChartsPanel,{abbr:selectedState,states:data.states}))
    ),
    React.createElement('div',{className:'data-table-section'},
      React.createElement('h3',null,'All States Data'),
      React.createElement(DataTable,{states:data.states,selectedState:selectedState,onSelect:setSelectedState,sortCol:sortCol,sortDir:sortDir,onSort:handleSort,searchTerm:searchTerm})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
